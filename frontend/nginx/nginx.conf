server {
    listen 80;
    server_name _;

    # Document root for static files
    root /usr/share/nginx/html;
    index index.html;

    # Compress responses
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets (CSS, JS) aggressively; HTML never cached so deployments are instant
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Serve all HTML pages — no caching so refreshes always get the latest
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Proxy /api/* → FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Increase timeouts for long ingestion uploads
        proxy_read_timeout    600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;

        # Allow large CSV uploads (up to 2 GB)
        client_max_body_size 2048m;
    }

    # Serve uploaded product images (mapped from backend's /data/uploads/validations)
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fallback — serve index.html for unmatched paths (SPA-style)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options      "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy      "same-origin" always;
}

services:
  backend:
    build: .
    container_name: flipkart-backend

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    volumes:
      - validation_uploads:/app/data/uploads/validations

    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: flipkart-frontend

    ports:
      - "3000:80"

    volumes:
      # Serve uploaded product images via Nginx /uploads/ path
      - validation_uploads:/app/uploads:ro

    depends_on:
      - backend

  postgres:
    image: postgres:17

    container_name: flipkart-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flipkart

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4

    container_name: flipkart-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data:
  validation_uploads: